name: Builds, tests & co

on:
  - push
  - pull_request

permissions: read-all

jobs:
  mobx-7-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: corepack enable

      - name: Pin MobX 7 for compatibility checks
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const path = 'pnpm-workspace.yaml'; const workspace = fs.readFileSync(path, 'utf8'); fs.writeFileSync(path, workspace.replace(/^overrides:\\n/m, 'overrides:\\n  mobx: 7.0.0\\n'));"

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Build runtime packages with MobX 7
        run: |
          pnpm --filter mobx-view-model run build
          pnpm --filter mobx-view-model-react run build
          pnpm --filter mobx-view-model-solid run build
          pnpm --filter mobx-view-model-devtools run build

      - name: Core type checks with MobX 7
        run: pnpm --filter mobx-view-model run check

      - name: Core tests with MobX 7
        run: pnpm --filter mobx-view-model test

      - name: Solid tests with MobX 7
        run: pnpm --filter mobx-view-model-solid test

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
    runs-on: ubuntu-latest
    # Keep browser/fonts identical to the visual-baseline generator.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:bc6ab0d6d44ff4826e4cb8c1e6d801e185bfc42bb0753f8e2a30efc70db054c7
      options: --ipc=host
    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up Node.js
        uses: actions/setup-node@v6
        with:
          check-latest: true
          node-version: ${{ matrix.node-version }}

      - run: corepack enable

      - name: Install deps
        run: pnpm i

      - name: Lint + Typings Check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: React SSR browser navigation
        run: pnpm --filter mobx-view-model-example-ssr-expressjs test:browser

      - name: DevTools browser regressions
        run: |
          pnpm --filter mobx-view-model-devtools exec playwright test --workers=2

      - name: DevTools Storybook
        run: |
          pnpm --filter mobx-view-model-devtools build:storybook
          pnpm --filter mobx-view-model-devtools test:storybook

      - name: Type regression (React 18-19)
        run: pnpm test:type-regression

      - name: Examples build
        run: pnpm examples:build

      - name: Docs build
        run: pnpm docs:build

      - name: Tests (unit)
        run: pnpm test:coverage

      - name: Tests (examples snapshots)
        run: pnpm test:examples

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: devtools-browser-diagnostics
          path: packages/devtools/test-results/
          if-no-files-found: ignore
          retention-days: 7
